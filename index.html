<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoreo Interno BTL</title>
    <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1n9bD3nXaotF1G21LYdfSTpQqgCStXaxg">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Estilo de la pantalla de bloqueo */
        #login-container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 100%;
            max-width: 400px;
        }

        .login-logos {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .login-logos img {
            max-height: 45px;
            object-fit: contain;
        }

        #login-container h2 {
            margin-bottom: 10px;
            color: #333;
            font-size: 22px;
        }

        #login-container input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }

        #login-container button {
            width: 100%;
            padding: 12px;
            background-color: #0078d4;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }

        #login-container button:hover {
            background-color: #005a9e;
        }

        #error-msg {
            color: #d83b01;
            margin-top: 10px;
            font-size: 14px;
            display: none;
        }

        /* Estilo del contenedor principal del sitio */
        #dashboard-container {
            display: none;
            width: 100vw;
            height: 100vh;
            flex-direction: column;
        }

        header {
            background-color: #1b003a;
            color: white;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .header-logos {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-logos img {
            max-height: 35px;
            object-fit: contain;
        }

        /* Botones de pestañas superiores */
        .header-tabs {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }

        .tab-btn:hover {
            background-color: rgba(255, 255, 255, 0.25);
        }

        /* Estilo para la pestaña activa */
        .tab-btn.active {
            background-color: #0078d4;
            border-color: #0078d4;
            font-weight: 600;
        }

        header button.logout-btn {
            background-color: transparent;
            border: 1px solid white;
            color: white;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
        }

        header button.logout-btn:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        /* Contenido de las secciones */
        .content-section {
            display: none;
            flex-grow: 1;
            width: 100%;
            height: 100%;
        }

        .content-section.active {
            display: flex;
        }

        .content-section iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Pantalla de Acceso -->
    <div id="login-container">
        <div class="login-logos">
            <img src="https://lh3.googleusercontent.com/d/1n9bD3nXaotF1G21LYdfSTpQqgCStXaxg" alt="Logo BTL">
        </div>
        <h2>Acceso Restringido</h2>
        <p style="color: #666; font-size: 14px; margin-bottom: 20px;">Introduce tu código de acceso para visualizar el panel.</p>
        <input type="password" id="access-code" placeholder="Código de acceso">
        <button onclick="verificarCodigo()">Entrar</button>
        <div id="error-msg">Código incorrecto. Inténtalo de nuevo.</div>
    </div>

    <!-- Contenedor Principal (Oculto inicialmente) -->
    <div id="dashboard-container">
        <header>
            <div class="header-left">
                <div class="header-logos">
                    <img src="https://lh3.googleusercontent.com/d/1n9bD3nXaotF1G21LYdfSTpQqgCStXaxg" alt="Logo BTL">
                </div>
                
                <!-- PESTAÑAS DE NAVEGACIÓN INTERNA -->
                <div class="header-tabs">
                    <button class="tab-btn active" onclick="cambiarPestana('POWER BI CALOX', this)">CALOX</button>
                    <button class="tab-btn" onclick="cambiarPestana('POWER BI MUNCHY', this)">MUNCHY</button>
                    <button class="tab-btn" onclick="cambiarPestana('POWER BI FUNDICION', this)">FP</button>
                    <button class="tab-btn" onclick="cambiarPestana('POWER BI OLEICA', this)">OLEICA</button>
                    <button class="tab-btn" onclick="cambiarPestana('POWER BI LACTALIS', this)">LACTALIS</button>
                    <button class="tab-btn" onclick="cambiarPestana('POWER BI MIMESA', this)">MIMESA</button>
                    <button class="tab-btn" onclick="cambiarPestana('POWER BI PLUMROSE', this)">PLUMROSE</button>
                    <button class="tab-btn" onclick="cambiarPestana('POWER BI SAN SIMON', this)">SAN SIMON</button>
                    <button class="tab-btn" onclick="cambiarPestana('POWER BI VALMY', this)">VALMY</button>
                </div>
            </div>

            <button class="logout-btn" onclick="cerrarSesion()">Salir</button>
        </header>

        <!-- SECCIONES DE POWER BI -->
        <div id="seccion-POWER BI CALOX" class="content-section active">
            <iframe title="POWER BI CALOX" src="https://app.powerbi.com/view?r=eyJrIjoiNDM1NGYxZjQtY2YwYS00NzQyLThmZGYtOTc1NmM0NWE1ODM3IiwidCI6IjliNzVhNTU3LWQ2MTMtNDgyOC1iYjNjLWU3NGRhN2EwOTk1ZCIsImMiOjR9" allowFullScreen="true"></iframe>
        </div>

        <div id="seccion-POWER BI MUNCHY" class="content-section">
            <iframe title="POWER BI MUNCHY" src="https://app.powerbi.com/view?r=eyJrIjoiNGJhN2ZlYTctMzQwZC00MmI3LWIxZjgtYzcwMDVhMjM0OTNmIiwidCI6IjliNzVhNTU3LWQ2MTMtNDgyOC1iYjNjLWU3NGRhN2EwOTk1ZCIsImMiOjR9" allowFullScreen="true"></iframe>
        </div>

        <div id="seccion-POWER BI FUNDICION" class="content-section">
            <iframe title="POWER BI FUNDICION" src="https://app.powerbi.com/view?r=eyJrIjoiMzVhYTM5NWUtNjJiMS00N2Q3LThjM2QtMjY1ZTMxYTQ2NTdjIiwidCI6IjliNzVhNTU3LWQ2MTMtNDgyOC1iYjNjLWU3NGRhN2EwOTk1ZCIsImMiOjR9" allowFullScreen="true"></iframe>
        </div>

        <div id="seccion-POWER BI OLEICA" class="content-section">
            <iframe title="POWER BI OLEICA" src="https://app.powerbi.com/view?r=eyJrIjoiOGY3ZTFjNjgtMjZhMi00ZTQ0LWIxZjgtNTMwMGFhYWZiNmU1IiwidCI6IjliNzVhNTU3LWQ2MTMtNDgyOC1iYjNjLWU3NGRhN2EwOTk1ZCIsImMiOjR9" allowFullScreen="true"></iframe>
        </div>

        <div id="seccion-POWER BI LACTALIS" class="content-section">
            <iframe title="POWER BI LACTALIS" src="https://app.powerbi.com/view?r=eyJrIjoiNmQ1ZTViZGMtNTVjZS00ZTE3LTliMzYtNGE0NGFiOGQwYzA5IiwidCI6IjliNzVhNTU3LWQ2MTMtNDgyOC1iYjNjLWU3NGRhN2EwOTk1ZCIsImMiOjR9" allowFullScreen="true"></iframe>
        </div>
     
        <div id="seccion-POWER BI MIMESA" class="content-section">
            <iframe title="POWER BI MIMESA" src="https://app.powerbi.com/view?r=eyJrIjoiMjMxMDU5OWYtMWFhNC00NjY3LWE5NmYtYTZiMTI1MjY1NzUyIiwidCI6IjliNzVhNTU3LWQ2MTMtNDgyOC1iYjNjLWU3NGRhN2EwOTk1ZCIsImMiOjR9" allowFullScreen="true"></iframe>
        </div>
     
        <div id="seccion-POWER BI PLUMROSE" class="content-section">
            <iframe title="POWER BI PLUMROSE" src="https://app.powerbi.com/viewBy=eyJrIjoiMGE5OGEzNTAtNjg5Ny00ZmRiLTkwMjQtMmUyYmViNmI4YTU4IiwidCI6IjliNzVhNTU3LWQ2MTMtNDgyOC1iYjNjLWU3NGRhN2EwOTk1ZCIsImMiOjR9" allowFullScreen="true"></iframe>
        </div>
     
        <div id="seccion-POWER BI SAN SIMON" class="content-section">
            <iframe title="POWER BI SAN SIMON" src="https://app.powerbi.com/view?r=eyJrIjoiZWZjOTdkNjgtY2Y3NS00YWE4LThmZWEtMmQ3OWFkNjQwZjlkIiwidCI6IjliNzVhNTU3LWQ2MTMtNDgyOC1iYjNjLWU3NGRhN2EwOTk1ZCIsImMiOjR9" allowFullScreen="true"></iframe>
        </div>
     
        <div id="seccion-POWER BI VALMY" class="content-section">
            <iframe title="POWER BI VALMY" src="https://app.powerbi.com/view?r=eyJrIjoiNmM3NDkxOWUtZDg0NC00MTkzLWI5MmUtZThjMzc5MTg0MzZiIiwidCI6IjliNzVhNTU3LWQ2MTMtNDgyOC1iYjNjLWU3NGRhN2EwOTk1ZCIsImMiOjR9" allowFullScreen="true"></iframe>
        </div>            
    </div>

    <script>
        const CLAVES_VALIDAS = ["2864", "BTL2026"]; 

        function verificarCodigo() {
            const inputVal = document.getElementById("access-code").value.trim();
            const errorMsg = document.getElementById("error-msg");

            if (CLAVES_VALIDAS.includes(inputVal)) {
                document.getElementById("login-container").style.display = "none";
                document.getElementById("dashboard-container").style.display = "flex";
                errorMsg.style.display = "none";
            } else {
                errorMsg.style.display = "block";
            }
        }

        document.getElementById("access-code").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                verificarCodigo();
            }
        });

        function cambiarPestana(seccion, boton) {
            document.querySelectorAll('.content-section').forEach(sec => {
                sec.classList.remove('active');
            });

            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });

            // Selección limpia y correcta usando template strings
            const seccionId = 'seccion-' + seccion;
            const elementoSeccion = document.getElementById(seccionId);
            
            if (elementoSeccion) {
                elementoSeccion.classList.add('active');
            }
            
            boton.classList.add('active');
        }

        function cerrarSesion() {
            document.getElementById("dashboard-container").style.display = "none";
            document.getElementById("login-container").style.display = "block";
            document.getElementById("access-code").value = "";
            cambiarPestana('POWER BI CALOX', document.querySelector('.tab-btn'));
        }
    </script>

</body>
</html>
