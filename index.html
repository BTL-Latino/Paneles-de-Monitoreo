<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoreo Interno BTL</title>
    <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1n9bD3nXaotF1G21LYdfSTpQqgCStXaxg">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        #login-container { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); text-align: center; width: 100%; max-width: 400px; }
        .login-logos { display: flex; justify-content: center; align-items: center; gap: 20px; margin-bottom: 20px; }
        .login-logos img { max-height: 45px; object-fit: contain; }
        #login-container h2 { margin-bottom: 10px; color: #333; font-size: 22px; }
        #login-container input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        #login-container button { width: 100%; padding: 12px; background-color: #0078d4; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; transition: background 0.3s; }
        #login-container button:hover { background-color: #005a9e; }
        #error-msg { color: #d83b01; margin-top: 10px; font-size: 14px; display: none; }
        #dashboard-container { display: none; width: 100vw; height: 100vh; flex-direction: column; }
        header { background-color: #1b003a; color: white; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; }
        .header-left { display: flex; align-items: center; gap: 20px; }
        .header-logos { display: flex; align-items: center; gap: 10px; }
        .header-logos img { max-height: 35px; object-fit: contain; }
        .header-tabs { display: flex; gap: 10px; flex-wrap: wrap; }
        .tab-btn { background-color: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); color: white; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 14px; transition: background 0.3s; }
        .tab-btn:hover { background-color: rgba(255, 255, 255, 0.25); }
        .tab-btn.active { background-color: #0078d4; border-color: #0078d4; font-weight: 600; }
        header button.logout-btn { background-color: transparent; border: 1px solid white; color: white; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
        header button.logout-btn:hover { background-color: rgba(255, 255, 255, 0.1); }
        #viewer-container { flex-grow: 1; width: 100%; height: 100%; display: flex; }
        #viewer-container iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div id="login-container">
        <div class="login-logos">
            <img src="https://lh3.googleusercontent.com/d/1n9bD3nXaotF1G21LYdfSTpQqgCStXaxg" alt="Logo BTL">
        </div>
        <h2>Acceso Restringido</h2>
        <p style="color: #666; font-size: 14px; margin-bottom: 20px;">Introduce tu código de acceso para visualizar el panel.</p>
        <input type="password" id="access-code" placeholder="Código de acceso">
        <button id="btn-login">Entrar</button>
        <div id="error-msg">Código incorrecto. Inténtalo de nuevo.</div>
    </div>

    <div id="dashboard-container">
        <header>
            <div class="header-left">
                <div class="header-logos">
                    <img src="https://lh3.googleusercontent.com/d/1n9bD3nXaotF1G21LYdfSTpQqgCStXaxg" alt="Logo BTL">
                </div>
                <div class="header-tabs" id="tabs-container"></div>
            </div>
            <button class="logout-btn" id="btn-logout">Salir</button>
        </header>
        <div id="viewer-container"></div>
    </div>

    <script>
        const HASHES_VALIDOS = [
            "62506d645463218c6f3339860582a294d90d4a4c1d18b86d60e8c678b2f35902",
            "8e8a7f5e391b976b036c2e4c92a2c904338184569e63d518f04f293c5a6c318e"
        ];

        const REPORTES = [
            { nombre: "CALOX", url: "https://app.powerbi.com/view?r=eyJrIjoiNDM1NGYxZjQtY2YwYS00NzQyLThmZGYtOTc1NmM0NWE1ODM3IiwidCI6IjliNzVhNTU3LWQ2MTMtNDgyOC1iYjNjLWU3NGRhN2EwOTk1ZCIsImMiOjR9" },
            { nombre: "FP", url: "https://app.powerbi.com/view?r=eyJrIjoiMzVhYTM5NWUtNjJiMS00N2Q3LThjM2QtMjY1ZTMxYTQ2NTdjIiwidCI6IjliNzVhNTU3LWQ2MTMtNDgyOC1iYjNjLWU3NGRhN2EwOTk1ZCIsImMiOjR9" },
            { nombre: "LACTALIS", url: "https://app.powerbi.com/view?r=eyJrIjoiNmQ1ZTViZGMtNTVjZS00ZTE3LTliMzYtNGE0NGFiOGQwYzA5IiwidCI6IjliNzVhNTU3LWQ2MTMtNDgyOC1iYjNjLWU3NGRhN2EwOTk1ZCIsImMiOjR9" },
            { nombre: "MIMESA", url: "https://app.powerbi.com/view?r=eyJrIjoiMjMxMDU5OWYtMWFhNC00NjY3LWE5NmYtYTZiMTI1MjY1NzUyIiwidCI6IjliNzVhNTU3LWQ2MTMtNDgyOC1iYjNjLWU3NGRhN2EwOTk1ZCIsImMiOjR9" },
            { nombre: "MUNCHY", url: "https://app.powerbi.com/view?r=eyJrIjoiNGJhN2ZlYTctMzQwZC00MmI3LWIxZjgtYzcwMDVhMjM0OTNmIiwidCI6IjliNzVhNTU3LWQ2MTMtNDgyOC1iYjNjLWU3NGRhN2EwOTk1ZCIsImMiOjR9" },
            { nombre: "OLEICA", url: "https://app.powerbi.com/view?r=eyJrIjoiOGY3ZTFjNjgtMjZhMi00ZTQ0LWIxZjctNTMwMGFhYWZiNmU1IiwidCI6IjliNzVhNTU3LWQ2MTMtNDgyOC1iYjNjLWU3NGRhN2EwOTk1ZCIsImMiOjR9" },
            { nombre: "PLUMROSE", url: "https://app.powerbi.com/view?r=eyJrIjoiMGE5OGEzNTAtNjg5Ny00ZmRiLTkwMjQtMmUyYmViNmI4YTU4IiwidCI6IjliNzVhNTU3LWQ2MTMtNDgyOC1iYjNjLWU3NGRhN2EwOTk1ZCIsImMiOjR9" },
            { nombre: "SAN SIMON", url: "https://app.powerbi.com/view?r=eyJrIjoiZWZjOTdkNjgtY2Y3NS00YWE4LThmZWEtMmQ3OWFkNjQwZjlkIiwidCI6IjliNzVhNTU3LWQ2MTMtNDgyOC1iYjNjLWU3NGRhN2EwOTk1ZCIsImMiOjR9" },
            { nombre: "SURA", url: "https://app.powerbi.com/view?r=eyJrIjoiMWI2Y2E2N2MtYjQ2Yi00ZDk4LWJlNzEtOGM3N2NmNGFmNjg2IiwidCI6IjliNzVhNTU3LWQ2MTMtNDgyOC1iYjNjLWU3NGRhN2EwOTk1ZCIsImMiOjR9&pageName=56b3173295c508c233c0" },
            { nombre: "VALMY", url: "https://app.powerbi.com/view?r=eyJrIjoiNmM3NDkxOWUtZDg0NC00MTkzLWI5MmUtZThjMzc5MTg0MzZiIiwidCI6IjliNzVhNTU3LWQ2MTMtNDgyOC1iYjNjLWU3NGRhN2EwOTk1ZCIsImMiOjR9" }
        ];

        async function generarHash(texto) {
            const encoder = new TextEncoder();
            const data = encoder.encode(texto);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        function construirPanel() {
            const tabsContainer = document.getElementById("tabs-container");
            tabsContainer.innerHTML = "";
            REPORTES.forEach((rep, index) => {
                const btn = document.createElement("button");
                btn.className = "tab-btn" + (index === 0 ? " active" : "");
                btn.textContent = rep.nombre;
                btn.onclick = () => cargarReporte(rep.url, btn);
                tabsContainer.appendChild(btn);
            });
            cargarReporte(REPORTES[0].url, tabsContainer.firstChild);
        }

        function cargarReporte(url, botonActivo) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            if (botonActivo) botonActivo.classList.add('active');
            document.getElementById("viewer-container").innerHTML = `<iframe src="${url}" allowFullScreen="true"></iframe>`;
        }

        async function verificarCodigo() {
            const inputVal = document.getElementById("access-code").value.trim();
            const hashIngresado = await generarHash(inputVal);
            const errorMsg = document.getElementById("error-msg");

            if (HASHES_VALIDOS.includes(hashIngresado)) {
                document.getElementById("login-container").style.display = "none";
                document.getElementById("dashboard-container").style.display = "flex";
                errorMsg.style.display = "none";
                construirPanel();
            } else {
                errorMsg.style.display = "block";
            }
        }

        document.getElementById("btn-login").addEventListener("click", verificarCodigo);
        document.getElementById("access-code").addEventListener("keypress", (e) => {
            if (e.key === "Enter") verificarCodigo();
        });

        document.getElementById("btn-logout").addEventListener("click", () => {
            document.getElementById("dashboard-container").style.display = "none";
            document.getElementById("login-container").style.display = "block";
            document.getElementById("access-code").value = "";
            document.getElementById("viewer-container").innerHTML = "";
            document.getElementById("tabs-container").innerHTML = "";
        });
    </script>
</body>
</html>
